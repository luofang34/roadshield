[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-or-later"
repository = "https://github.com/luofang34/roadshield"
homepage = "https://github.com/luofang34/roadshield"

[workspace.dependencies]
roadshield = { path = "crates/roadshield" }
roadshield-raster = { path = "crates/roadshield-raster" }
roadshield-import = { path = "crates/roadshield-import" }
blake3 = { version = "1.8", default-features = false }
csscolorparser = "0.9"
harfrust = { version = "0.14", default-features = false, features = ["std"] }
indexmap = { version = "2", features = ["serde"] }
quick-xml = "0.42"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
skrifa = { version = "0.48", default-features = false, features = ["std"] }
thiserror = "2"
tiny-skia = "0.12"
tracing = "0.1"
usvg = { version = "0.48", default-features = false, features = ["writer"] }
resvg = { version = "0.48", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "forbid"

[workspace.lints.clippy]
# Every default clippy group (correctness, suspicious, style, complexity,
# perf) is an error regardless of command-line flags.
all = { level = "deny", priority = -1 }
# Pedantic lints the code base is clean of; keep it that way.
cast_lossless = "deny"
default_trait_access = "deny"
doc_markdown = "deny"
format_collect = "deny"
implicit_hasher = "deny"
map_unwrap_or = "deny"
missing_errors_doc = "deny"
missing_fields_in_debug = "deny"
must_use_candidate = "deny"
ref_option = "deny"
return_self_not_must_use = "deny"
semicolon_if_nothing_returned = "deny"
single_match_else = "deny"
uninlined_format_args = "deny"
unreadable_literal = "deny"
unused_self = "deny"
unwrap_used = "forbid"
expect_used = "forbid"
panic = "forbid"
todo = "forbid"
unimplemented = "forbid"
unreachable = "forbid"
exit = "forbid"
mem_forget = "forbid"
get_unwrap = "forbid"
let_underscore_must_use = "deny"
let_underscore_future = "deny"
await_holding_lock = "deny"
disallowed_types = "deny"

[profile.release]
lto = "thin"
