name: release

on:
  workflow_dispatch:
    inputs:
      crate:
        description: Crate to publish to crates.io
        required: true
        default: roadshield

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test before publishing
        run: cargo test -p "${{ inputs.crate }}" --all-targets
      - name: Publish
        run: cargo publish -p "${{ inputs.crate }}" --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
